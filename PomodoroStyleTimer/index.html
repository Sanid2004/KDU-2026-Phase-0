<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="container">
            <div class="box">
                <p>Focus Timer</p>
                <p id="para">Stay productive with the Pomodoro Technique</p>
                <div class="timer">
                    25:00
                </div>
                <button class="btn">Start</button>
                <button class="btn">Pause</button>
                <button class="btn">Reset</button>
                <div class="CustomizeTimer">
                    <p>Customize your timer</p>
                    <div id="cont">
                    <input type="text" id="time">
                    <button id="setTime">
                        Set Timer
                    </button>
                    </div>
                </div>
                <div id="session">
                    <p>Sessions Completed : 0</p>
                </div>
            </div>
        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
